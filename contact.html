    <style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --pink: #FF6B9D;
    --purple: #D5A6E0;
    --bg: #12142a;
    --text: #f6f3f8;
    --muted: rgba(246, 243, 248, 0.55);
    --line: rgba(246, 243, 248, 0.18);
}

html, body { background: var(--bg); }

body {
    font-family: 'Montserrat', sans-serif;
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
}

.contact-page { position: relative; min-height: 100vh; display: flex; flex-direction: column; }

.contact-photo { position: absolute; top: 0; right: 0; bottom: 0; width: 58%; z-index: 0; }
.contact-photo picture, .contact-photo img { display: block; width: 100%; height: 100%; }
.contact-photo img { object-fit: cover; object-position: center 25%; }
.contact-photo::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(90deg, var(--bg) 0%, rgba(18, 20, 42, 0.78) 28%, rgba(18, 20, 42, 0.25) 70%, rgba(18, 20, 42, 0.1) 100%); }
.contact-photo::after { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(18, 20, 42, 0.45) 0%, transparent 25%, transparent 75%, rgba(18, 20, 42, 0.5) 100%); }

.top-bar { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; padding: 26px 56px; }
.top-bar .logo img { height: 34px; width: auto; display: block; }
.top-bar a.back { color: var(--text); text-decoration: none; font-size: 0.9rem; font-weight: 500; opacity: 0.8; transition: opacity 0.2s ease, color 0.2s ease; }
.top-bar a.back:hover { opacity: 1; color: var(--pink); }

.contact-main { position: relative; z-index: 2; flex: 1; display: flex; align-items: center; padding: 20px 56px 60px; }
.contact-inner { width: 100%; max-width: 640px; }

.heading { border-left: 4px solid var(--pink); padding-left: 26px; margin-bottom: 3.2rem; }
.heading .eyebrow { font-size: 1.05rem; color: var(--text); opacity: 0.9; }
.heading h1 { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: clamp(3rem, 8vw, 5.6rem); line-height: 1.02; letter-spacing: -1px; }

.info-row { display: flex; flex-wrap: wrap; gap: 1.5rem 3rem; margin-bottom: 3.2rem; }
.info-item .head { display: flex; align-items: center; gap: 10px; font-size: 1rem; font-weight: 500; margin-bottom: 0.7rem; }
.info-item .head svg { width: 15px; height: 15px; color: var(--text); flex: none; }
.info-item .body { padding-left: 25px; font-size: 0.92rem; color: var(--muted); }
.info-item a { color: var(--muted); text-decoration: none; transition: color 0.2s ease; }
.info-item a:hover { color: var(--pink); }

.get-in-touch { display: flex; align-items: center; gap: 14px; font-size: 1.1rem; font-weight: 500; margin-bottom: 2.2rem; }
.get-in-touch::before { content: ""; width: 3px; height: 18px; background: var(--pink); }

.cform { max-width: 600px; }
.step { display: none; }
.step.active { display: block; animation: stepIn 0.35s ease; }
@keyframes stepIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.step label { display: block; font-size: 0.72rem; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin-bottom: 1rem; }
.step input, .step textarea, .step select { width: 100%; padding: 8px 0 14px; border: none; border-bottom: 1px solid var(--line); background: transparent; color: var(--text); font-family: 'Fredoka', sans-serif; font-size: clamp(1.4rem, 3.2vw, 2rem); font-weight: 500; border-radius: 0; transition: border-color 0.25s ease; }
.step textarea { resize: none; height: 96px; line-height: 1.3; }
.step input::placeholder, .step textarea::placeholder { color: rgba(246, 243, 248, 0.28); }
.step input:focus, .step textarea:focus, .step select:focus { outline: none; border-bottom-color: var(--pink); }
.step select { width: auto; max-width: 42%; font-size: 1rem; font-family: 'Montserrat', sans-serif; padding-bottom: 20px; }
.step select option { color: #222; }
.phone-row { display: flex; gap: 16px; align-items: flex-end; }
.phone-row input { flex: 1; min-width: 0; }
.err { min-height: 1.3rem; margin-top: 0.6rem; color: #ff8fb0; font-size: 0.82rem; font-weight: 600; }

.form-foot { display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; margin-top: 1.6rem; }
.dots { display: flex; gap: 2rem; }
.dots button { background: none; border: 0; padding: 0; cursor: pointer; font-family: inherit; font-size: 0.7rem; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(246, 243, 248, 0.35); text-align: left; transition: color 0.2s ease; }
.dots button::before { content: ""; display: block; width: 5px; height: 5px; border-radius: 50%; background: currentColor; margin-bottom: 8px; }
.dots button.active { color: var(--text); }
.dots button.active::before { background: var(--pink); }
.dots button.done { color: var(--muted); }
.next { display: inline-flex; align-items: center; gap: 18px; background: none; border: 0; color: var(--text); font-family: inherit; font-size: 1rem; font-weight: 500; cursor: pointer; }
.next .circle { width: 72px; height: 72px; border-radius: 50%; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; transition: all 0.25s ease; }
.next .circle svg { width: 24px; height: 24px; }
.next:hover .circle { background: var(--pink); border-color: var(--pink); }
.next:disabled { opacity: 0.5; cursor: default; }
.form-note { margin-top: 1.4rem; font-size: 0.9rem; color: #7be0a3; font-weight: 600; min-height: 1.3rem; }
.form-note.bad { color: #ff8fb0; }

.social { display: flex; flex-wrap: wrap; gap: 0.6rem 2rem; margin-top: 2.6rem; }
.social a { color: var(--muted); text-decoration: none; font-size: 0.85rem; letter-spacing: 0.5px; transition: color 0.2s ease; }
.social a:hover { color: var(--pink); }

@media (max-width: 860px) {
    .contact-photo { position: relative; width: 100%; height: 34vh; min-height: 220px; }
    .contact-photo::before { background: linear-gradient(180deg, rgba(18, 20, 42, 0.15) 0%, var(--bg) 100%); }
    .contact-photo::after { display: none; }
    .contact-page { display: block; }
    .top-bar { position: absolute; top: 0; left: 0; right: 0; padding: 18px 20px; }
    .contact-main { padding: 0 20px 50px; margin-top: -40px; }
    .heading { margin-bottom: 2rem; padding-left: 18px; }
    .info-row { gap: 1.2rem 2rem; margin-bottom: 2.2rem; }
    .dots { gap: 1rem; }
    .dots button { letter-spacing: 1.2px; font-size: 0.62rem; }
    .next .circle { width: 60px; height: 60px; }
    .next .label { display: none; }
}
    </style>

<body>
    <div class="contact-page">
        <div class="contact-photo">
            <picture>
                <source media="(max-width: 860px)" srcset="assets/contact-hero-640.webp">
                <img src="assets/contact-hero-1000.webp" alt="The Besties girls together" fetchpriority="high">
            </picture>
        </div>

        <header class="top-bar">
            <a href="index.html" class="logo"><img src="assets/besties-logo-480.webp" alt="Besties"></a>
            <a href="index.html" class="back">← Back to Home</a>
        </header>

        <main class="contact-main">
            <div class="contact-inner">
                <div class="heading">
                    <p class="eyebrow">How to contact us</p>
                    <h1>Contacts</h1>
                </div>

                <div class="info-row">
                    <div class="info-item">
                        <div class="head"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg>Location</div>
                        <div class="body">Accra, Ghana</div>
                    </div>
                    <div class="info-item">
                        <div class="head"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.6a1 1 0 0 1-.25 1Z"/></svg>Phone</div>
                        <div class="body"><a href="https://wa.me/233248051774" target="_blank" rel="noopener">+233 24 805 1774</a></div>
                    </div>
                    <div class="info-item">
                        <div class="head"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 5h16a2 2 0 0 1 2 2v.4l-10 6.2L2 7.4V7a2 2 0 0 1 2-2Zm18 4.75V17a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9.75l10 6.2Z"/></svg>E-mail</div>
                        <div class="body"><a href="mailto:contact@bestiesafrica.com">contact@bestiesafrica.com</a></div>
                    </div>
                </div>

                <div class="get-in-touch">Get in touch</div>

                <form class="cform" id="contactForm" novalidate>
                    <div class="step active" data-field="name">
                        <label for="cName">Your name</label>
                        <input type="text" id="cName" maxlength="80" autocomplete="name" placeholder="Enter your name">
                        <div class="err">Please enter your name.</div>
                    </div>
                    <div class="step" data-field="email">
                        <label for="cEmail">Your email</label>
                        <input type="email" id="cEmail" maxlength="120" autocomplete="email" inputmode="email" placeholder="Enter your email">
                        <div class="err">Please enter a valid email address.</div>
                    </div>
                    <div class="step" data-field="phone">
                        <label for="cPhone">Phone / WhatsApp</label>
                        <div class="phone-row"><select id="cCode" aria-label="Country code"><option value="+233" selected>Ghana +233</option><option value="+234">Nigeria +234</option><option value="+254">Kenya +254</option><option value="+27">South Africa +27</option><option value="+255">Tanzania +255</option><option value="+256">Uganda +256</option><option value="+225">Côte d'Ivoire +225</option><option value="+221">Senegal +221</option><option value="+237">Cameroon +237</option><option value="+250">Rwanda +250</option><option value="+251">Ethiopia +251</option><option value="+20">Egypt +20</option><option value="+212">Morocco +212</option><option value="+44">United Kingdom +44</option><option value="+1">USA / Canada +1</option><option value="+49">Germany +49</option><option value="+33">France +33</option><option value="+971">UAE +971</option><option value="+61">Australia +61</option></select><input type="tel" id="cPhone" maxlength="20" autocomplete="tel-national" inputmode="tel" placeholder="Your number"></div>
                        <div class="err">Please enter a valid phone number.</div>
                    </div>
                    <div class="step" data-field="message">
                        <label for="cMessage">Your message</label>
                        <textarea id="cMessage" maxlength="800" placeholder="Tell us how we can help"></textarea>
                        <div class="err">Please write a short message.</div>
                    </div>

                    <div class="form-foot">
                        <div class="dots" id="dots">
                            <button type="button" class="active" data-go="0">Name</button>
                            <button type="button" data-go="1">E-mail</button>
                            <button type="button" data-go="2">Phone</button>
                            <button type="button" data-go="3">Message</button>
                        </div>
                        <button type="submit" class="next" id="nextBtn">
                            <span class="label" id="nextLabel">Next</span>
                            <span class="circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h18M15 6l6 6-6 6"/></svg></span>
                        </button>
                    </div>
                    <p class="form-note" id="formNote" role="status" aria-live="polite"></p>
                </form>

                <div class="social">
                    <a href="https://www.instagram.com/bestgurlies" target="_blank" rel="noopener">Instagram</a>
                    <a href="https://www.tiktok.com/@bestgurlies" target="_blank" rel="noopener">TikTok</a>
                    <a href="https://youtube.com/@eglistudios" target="_blank" rel="noopener">YouTube</a>
                </div>
            </div>
        </main>
    </div>

    <script>
(function () {
    var ACCESS_KEY = '1b446358-75dc-4769-bb99-f1b0efcdad00'; // Web3Forms public key; emails go to contact@bestiesafrica.com
    var form = document.getElementById('contactForm');
    var note = document.getElementById('formNote');
    var steps = Array.prototype.slice.call(form.querySelectorAll('.step'));
    var dots = Array.prototype.slice.call(document.querySelectorAll('#dots button'));
    var nextBtn = document.getElementById('nextBtn');
    var nextLabel = document.getElementById('nextLabel');
    var code = document.getElementById('cCode');
    var order = ['name', 'email', 'phone', 'message'];
    var cur = 0;

    function ctrl(n) { return form.querySelector('[data-field="' + n + '"]').querySelector('input, textarea'); }
    function val(n) { return n === 'phone' ? ctrl(n).value.replace(/[^\d]/g, '').replace(/^0+/, '') : ctrl(n).value.trim(); }
    function bad(n) {
        var v = val(n);
        if (n === 'name') return v.length < 2;
        if (n === 'email') return !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
        if (n === 'phone') return v.length < 6 || v.length > 14;
        return v.length < 5;
    }
    function show(i) {
        cur = i;
        steps.forEach(function (s, n) { s.classList.toggle('active', n === i); });
        dots.forEach(function (d, n) { d.classList.toggle('active', n === i); d.classList.toggle('done', n < i); });
        nextLabel.textContent = i === steps.length - 1 ? 'Send' : 'Next';
        note.textContent = ''; note.classList.remove('bad');
        var c = ctrl(order[i]); if (c) c.focus({ preventScroll: true });
    }
    function showErr(n, on) { var s = form.querySelector('[data-field="' + n + '"]'); s.querySelector('.err').style.visibility = on ? 'visible' : 'hidden'; }
    order.forEach(function (n) {
        showErr(n, false);
        ctrl(n).addEventListener('input', function () { showErr(n, false); });
    });
    dots.forEach(function (d) {
        d.addEventListener('click', function () {
            var t = +d.dataset.go;
            for (var k = 0; k < t; k++) { if (bad(order[k])) { show(k); showErr(order[k], true); return; } }
            show(t);
        });
    });
    form.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && e.target.tagName === 'TEXTAREA' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
    });

    function fallback() {
        note.classList.add('bad');
        note.textContent = 'We could not send that automatically, so your email app is opening with your message ready to send to contact@bestiesafrica.com.';
        var body = 'Name: ' + val('name') + '\nEmail: ' + val('email') + '\nPhone: ' + code.value + ' ' + val('phone') + '\n\n' + val('message');
        window.location.href = 'mailto:contact@bestiesafrica.com?subject=' + encodeURIComponent('Message from bestiesafrica.com') + '&body=' + encodeURIComponent(body);
    }

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        var n = order[cur];
        if (bad(n)) { showErr(n, true); ctrl(n).focus(); return; }
        if (cur < steps.length - 1) { show(cur + 1); return; }
        for (var k = 0; k < order.length; k++) { if (bad(order[k])) { show(k); showErr(order[k], true); return; } }
        nextBtn.disabled = true;
        note.classList.remove('bad');
        note.textContent = 'Sending...';
        fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({
                access_key: ACCESS_KEY,
                subject: 'Besties website message from ' + val('name'),
                from_name: 'Besties Website',
                replyto: val('email'),
                name: val('name'),
                email: val('email'),
                phone: code.value + ' ' + val('phone'),
                message: val('message')
            })
        }).then(function (r) { return r.json(); }).then(function (d) {
            if (d.success) {
                form.reset();
                show(0);
                note.textContent = 'Thank you! Your message has been sent. We will get back to you soon.';
            } else {
                fallback();
            }
        }).catch(function () {
            fallback();
        }).then(function () { nextBtn.disabled = false; });
    });
})();
    </script>
    <script src="button-hover.js" defer></script>
