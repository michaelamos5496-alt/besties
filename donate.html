<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FF6B9D">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <title>Support Besties - Make a Donation</title>
    <script>
        if (window.self !== window.top) document.documentElement.classList.add('embedded');
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Fredoka:wght@400;500;600;700&display=swap">
    <style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --besties-pink: #FF6B9D;
    --besties-purple: #D5A6E0;
    --whatsapp: #25D366;
    --white: #FFFFFF;
    --dark-gray: #333333;
}

body {
    font-family: 'Montserrat', sans-serif;
    background: var(--white);
    color: var(--dark-gray);
    line-height: 1.8;
}

/* Navigation */
.nav-bar {
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #f5f5f5;
}

.nav-logo {
    display: inline-flex;
    align-items: center;
    text-decoration: none;
}

.nav-logo-img {
    height: 36px;
    width: auto;
    display: block;
}

.nav-back {
    text-decoration: none;
    color: var(--dark-gray);
    font-weight: 500;
    transition: color 0.3s ease;
}

.nav-back:hover {
    color: var(--besties-pink);
}

/* Donate */
.donate {
    max-width: 520px;
    margin: 0 auto;
    padding: 80px 24px;
    text-align: center;
}

.donate h1 {
    font-size: clamp(2.2rem, 8vw, 3rem);
    margin-bottom: 0.75rem;
    background: linear-gradient(135deg, var(--besties-pink) 0%, var(--besties-purple) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
}

.donate-intro {
    color: #777;
    font-weight: 300;
    margin-bottom: 2rem;
}

.amount-buttons {
    opacity: 0;
    transition: opacity 0.2s ease;
}

.amount-buttons.ready {
    opacity: 1;
}

.amount-buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.6rem;
    margin-bottom: 1.5rem;
}

.amount-btn {
    padding: 14px 8px;
    white-space: nowrap;
    border: 2px solid #e0e0e0;
    background: white;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: var(--dark-gray);
    transition: all 0.2s ease;
}

.amount-btn.active,
.amount-btn:hover {
    border-color: var(--besties-pink);
    color: var(--besties-pink);
    background: rgba(255, 107, 157, 0.05);
}

.whatsapp-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    width: 100%;
    padding: 16px;
    background: var(--whatsapp);
    color: #fff;
    border-radius: 10px;
    font-weight: 700;
    font-size: 1.05rem;
    text-decoration: none;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.whatsapp-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(37, 211, 102, 0.35);
}

.whatsapp-btn svg {
    width: 22px;
    height: 22px;
}

.donate-note {
    margin-top: 1rem;
    font-size: 0.85rem;
    color: #999;
}

/* Footer */
.footer {
    padding: 40px;
    text-align: center;
    border-top: 1px solid #f0f0f0;
    color: #999;
    font-size: 0.9rem;
}

.footer a {
    color: var(--dark-gray);
    text-decoration: none;
}

.footer a:hover {
    color: var(--besties-pink);
}

.embedded .nav-bar,
.embedded .footer {
    display: none;
}

.embedded .donate {
    padding: 56px 24px 32px;
}

@media (max-width: 480px) {
    .embedded .donate {
        padding: 40px 16px 20px;
    }

    .embedded .donate h1 {
        font-size: 1.8rem;
        margin-bottom: 0.4rem;
    }

    .embedded .donate-intro {
        font-size: 0.85rem;
        line-height: 1.6;
        margin-bottom: 1.1rem;
    }

    .embedded .amount-buttons {
        gap: 0.4rem;
        margin-bottom: 1rem;
    }

    .embedded .amount-btn {
        padding: 10px 4px;
        font-size: 0.9rem;
    }

    .embedded .whatsapp-btn {
        padding: 13px;
        font-size: 0.95rem;
    }

    .embedded .donate-note {
        margin-top: 0.6rem;
        font-size: 0.75rem;
        line-height: 1.5;
    }
}
    </style>
</head>
<body>
    <nav class="nav-bar">
        <a href="index.html" class="nav-logo"><img src="assets/besties-logo-480.webp" alt="Besties" class="nav-logo-img"></a>
        <a href="index.html" class="nav-back">← Back</a>
    </nav>

    <main class="donate">
        <h1>Support Besties</h1>
        <p class="donate-intro">Help us empower more girls. Pick an amount and we'll take it from there on WhatsApp.</p>

        <div class="amount-buttons" id="amountButtons">
            <button type="button" class="amount-btn" data-amount="50">$50</button>
            <button type="button" class="amount-btn" data-amount="100">$100</button>
            <button type="button" class="amount-btn" data-amount="200">$200</button>
            <button type="button" class="amount-btn" data-amount="500">$500</button>
            <button type="button" class="amount-btn" data-amount="">Other</button>
        </div>

        <a class="whatsapp-btn" id="donateLink" href="#" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.85 9.85 0 0 0 12.04 2zm0 1.67c2.2 0 4.26.86 5.82 2.42a8.2 8.2 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.24 8.23h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.26-8.24zM8.53 7.33c-.16 0-.43.06-.66.31-.22.25-.87.85-.87 2.07 0 1.22.89 2.39 1.01 2.56.12.16 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.46-.6 1.67-1.18.21-.58.21-1.07.15-1.18-.06-.1-.22-.16-.47-.28-.25-.13-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.16.25-.64.81-.78.97-.14.17-.29.19-.54.06-.25-.13-1.05-.39-2-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.5.11-.11.25-.29.37-.43.12-.15.16-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.42h-.48z"/>
            </svg>
            <span>Donate on WhatsApp</span>
        </a>
        <p class="donate-note">This opens WhatsApp with your message ready to send.</p>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Besties. <a href="index.html">Back to Home</a></p>
    </footer>

    <script>
(function () {
    const number = '233248051774';
    const link = document.getElementById('donateLink');
    const wrap = document.getElementById('amountButtons');
    const buttons = document.querySelectorAll('.amount-btn');
    let symbol = '$';
    let selected = null;

    function fmt(n) {
        return symbol + n.toLocaleString('en-US');
    }

    function update() {
        const text = selected
            ? "Hi Besties! I'd like to donate " + fmt(selected) + " to support the girls. How can I give?"
            : "Hi Besties! I'd like to donate to support the girls. How can I give?";
        link.href = 'https://wa.me/' + number + '?text=' + encodeURIComponent(text);
    }

    function getJson(url) {
        const ctl = new AbortController();
        const t = setTimeout(function () { ctl.abort(); }, 3500);
        return fetch(url, { signal: ctl.signal })
            .then(function (r) { if (!r.ok) throw new Error(r.status); return r; })
            .finally(function () { clearTimeout(t); });
    }

    function getCountry() {
        return getJson('https://api.country.is/')
            .then(function (r) { return r.json(); })
            .then(function (d) { return d.country; })
            .catch(function () {
                return getJson('https://www.cloudflare.com/cdn-cgi/trace')
                    .then(function (r) { return r.text(); })
                    .then(function (t) { const m = t.match(/^loc=(\w+)/m); return m ? m[1] : null; });
            })
            .catch(function () { return null; });
    }

    function inGhanaTimezone() {
        try {
            return Intl.DateTimeFormat().resolvedOptions().timeZone === 'Africa/Accra';
        } catch (e) {
            return false;
        }
    }

    function showCedis() {
        symbol = 'GH\u20B5';
        buttons.forEach(function (btn) {
            const amount = btn.dataset.amount;
            if (amount) btn.textContent = fmt(parseFloat(amount));
        });
    }

    buttons.forEach(function (btn) {
        btn.addEventListener('click', function () {
            buttons.forEach(function (b) { b.classList.remove('active'); });
            btn.classList.add('active');
            selected = btn.dataset.amount ? parseFloat(btn.dataset.amount) : null;
            update();
        });
    });

    update();

    if (inGhanaTimezone()) {
        showCedis();
        wrap.classList.add('ready');
    } else {
        getCountry()
            .then(function (country) {
                if (!country || country === 'GH') showCedis();
            })
            .finally(function () { wrap.classList.add('ready'); });
    }
})();
    </script>
</body>
</html>
